name: Temporary image import kesakeitto
on:
  push:
    branches: [recipe/kotiruoka-kesakeitto-draft-20261121]
    paths: [.github/workflows/temporary-import-kesakeitto.yml]
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'ozirix-dev/Reseptit'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Convert image to WebP
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'Pillow==11.3.0'
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          s=Path('docs/drafts/kesakeitto-import-preview.jpg');t=Path('kuvat/paaruoat/kesakeitto.webp')
          i=Image.open(s);i.load()
          assert i.format=='JPEG' and i.size==(960,746)
          t.parent.mkdir(parents=True,exist_ok=True)
          i.convert('RGB').save(t,format='WEBP',quality=82,method=6)
          check=Image.open(t);assert check.format=='WEBP' and check.size==i.size
          PY
      - name: Commit draft image
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'recipe/kotiruoka-kesakeitto-draft-20261121'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'kuvat/paaruoat/kesakeitto.webp'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add WebP image for kesakeitto'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
