name: Temporary image import suppilovahverokeitto
on:
  push:
    branches: [recipe/kotiruoka-suppilovahverokeitto-draft-20261121]
    paths: [.github/workflows/temporary-import-suppilovahverokeitto.yml]
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'ozirix-dev/Reseptit'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Convert JPEG to WebP
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'Pillow==11.3.0'
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          a=Path('docs/drafts/suppilovahverokeitto-import-preview.jpg');b=Path('kuvat/paaruoat/suppilovahverokeitto.webp')
          im=Image.open(a);im.load()
          assert im.format=='JPEG' and im.size==(960,746)
          b.parent.mkdir(parents=True,exist_ok=True)
          im.convert('RGB').save(b,format='WEBP',quality=82,method=6)
          c=Image.open(b);assert c.format=='WEBP' and c.size==im.size
          PY
      - name: Commit only to expected draft branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'recipe/kotiruoka-suppilovahverokeitto-draft-20261121'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'kuvat/paaruoat/suppilovahverokeitto.webp'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add WebP image for suppilovahverokeitto'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
