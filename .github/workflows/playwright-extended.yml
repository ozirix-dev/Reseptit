name: Recipavo Playwright extended (non-deploy)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/playwright-extended.yml"
      - ".github/scripts/prepare-verified-browser-images.ps1"
      - ".github/scripts/test_prepare_verified_browser_images.py"
  schedule:
    - cron: "17 2 * * 0"
  pull_request:
    paths:
      - "site/package-lock.json"
      - ".github/workflows/playwright-extended.yml"
      - ".github/scripts/prepare-verified-browser-images.ps1"
      - ".github/scripts/test_prepare_verified_browser_images.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recipavo-playwright-extended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extended:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Prepare SHA-verified browser image inputs
        shell: pwsh
        env:
          IMAGE_CI_PUBLIC_ONLY: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}
          IMAGE_CI_ACCESS_KEY_ID: ${{ !(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]')) && secrets.IMAGE_CI_ACCESS_KEY_ID || '' }}
          IMAGE_CI_SECRET_ACCESS_KEY: ${{ !(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]')) && secrets.IMAGE_CI_SECRET_ACCESS_KEY || '' }}
        run: ./.github/scripts/prepare-verified-browser-images.ps1
      - name: Install dependencies
        working-directory: site
        run: npm ci
      - name: Build local publishable site (no deployment)
        working-directory: site
        run: npm run build
      - name: Run extended Playwright browser matrix
        working-directory: site
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
          BROWSER_SUITES: "smoke ui routes images"
        run: node scripts/run-browser-suites.mjs
      - name: Preserve image evidence on failure, if present
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-extended-diagnostics
          path: tmp/v15/
          if-no-files-found: ignore
          retention-days: 7
