name: Repository hygiene

'on':
  schedule:
    - cron: '17 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  weekly-report:
    runs-on: ubuntu-24.04
    steps:
      - name: Read-only remote branch inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branches=$(gh api --paginate "repos/$REPO/branches?per_page=100" | jq -s '[.[][]] | length')
          pull_requests=$(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" | jq -s '[.[][]] | length')
          {
            echo '## Repository hygiene (read only)'
            echo "- Remote branches: $branches"
            echo "- Open PRs (including Draft): $pull_requests"
            echo '- All branches are preserved.'
            echo '- Local worktree inspection is run separately.'
          } >> "$GITHUB_STEP_SUMMARY"
