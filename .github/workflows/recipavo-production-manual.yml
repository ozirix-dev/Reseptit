name: Recipavo production release (manual)

# Never triggered by push or PR. GitHub Environment enforces a 10-minute wait timer and main-only branch.
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Approved current main commit: full 40-character lowercase SHA'
        required: true
        type: string
      confirmation:
        description: 'Explicitly approve the proposed production target'
        required: true
        type: choice
        default: DO_NOT_RELEASE
        options:
          - DO_NOT_RELEASE
          - RELEASE recipavo-site production

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: recipavo-production-release
  cancel-in-progress: false

jobs:
  gate:
    name: Read-only exact-SHA CI and 10-minute environment gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release gate logic (offline)
        run: node --test scripts/recipavo-actions-release-gate.test.mjs
      - name: Require current main, passing Recipe site CI and protected wait timer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/recipavo-actions-release-gate.mjs github "$RELEASE_SHA"

  release:
    name: Approved production build and Wrangler promotion
    needs: gate
    runs-on: ubuntu-24.04
    environment:
      name: recipavo-production
      url: https://www.recipavo.com/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Reconfirm main, CI and timer after GitHub environment wait
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/recipavo-actions-release-gate.mjs github-recheck "$RELEASE_SHA"
      - name: Verify Cloudflare project, branch, Direct Upload and feedback OFF
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/recipavo-actions-release-gate.mjs cloudflare
      - name: Verify or restore pinned production image inputs
        id: images
        shell: pwsh
        env:
          IMAGE_CI_ACCESS_KEY_ID: ${{ secrets.IMAGE_CI_ACCESS_KEY_ID }}
          IMAGE_CI_SECRET_ACCESS_KEY: ${{ secrets.IMAGE_CI_SECRET_ACCESS_KEY }}
        run: |
          $json = & python3 -B site/scripts/restore-image-inputs.py --manifest assets/images.manifest.json --project ozirix-dev/Reseptit --auto-root kuvat
          if ($LASTEXITCODE -ne 0) { throw 'Production image input verification failed' }
          $result = ($json -join "`n") | ConvertFrom-Json
          if ($result.status -ne 'PASS' -or [string]::IsNullOrWhiteSpace($result.imageRoot) -or
              -not [IO.Path]::IsPathRooted([string]$result.imageRoot) -or $result.imageRoot -match "[`r`n]") {
            throw 'Invalid image verifier output'
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "root=$($result.imageRoot)"
      - name: Apply SHA-verified Git image overlays to isolated image source
        env:
          VERIFIED_IMAGE_ROOT: ${{ steps.images.outputs.root }}
        run: |
          python3 -B site/scripts/verified_image_overlay.py \
            --manifest assets/images.tracked-overlays.json \
            --source-root kuvat --image-root "$VERIFIED_IMAGE_ROOT" --mode apply
      - name: Install pinned site dependencies
        working-directory: site
        run: npm ci
      - name: Build production-only artifact with feedback UI disabled
        shell: bash
        working-directory: site
        env:
          PROJECT_IMAGE_ROOT: ${{ steps.images.outputs.root }}
          RECIPAVO_BUILD_TARGET: production
          VITE_RECIPAVO_FEEDBACK_ENABLED: 'false'
        run: |
          set -euo pipefail
          unset RECIPAVO_PREVIEW_ORIGIN
          npm run build:production
          npm run test:static
      - name: Fail closed if Pages feedback Function would not be discovered
        run: node scripts/recipavo-actions-release-gate.mjs functions site
      - name: Stamp and verify immutable production artifact
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          node scripts/recipavo-actions-release-gate.mjs stamp "$RELEASE_SHA" site/dist
          node scripts/recipavo-actions-release-gate.mjs artifact "$RELEASE_SHA" site/dist
      - name: Final main/CI and Cloudflare settings recheck immediately before upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/recipavo-actions-release-gate.mjs github-recheck "$RELEASE_SHA"
          node scripts/recipavo-actions-release-gate.mjs cloudflare
      - name: Avoid redeploying a revision that is already live
        id: live
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: node scripts/recipavo-actions-release-gate.mjs live "$RELEASE_SHA"
      - name: Deploy exact SHA to existing Cloudflare Pages production branch
        if: steps.live.outputs.already_live != 'true'
        working-directory: site
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.165.0 pages deploy dist \
            --project-name recipavo-site --branch production --commit-hash "$RELEASE_SHA"
      - name: Verify production pages, SEO, assets, SHA and Functions GET 405
        shell: bash
        working-directory: site
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RECIPAVO_BUILD_TARGET: production
        run: |
          set -euo pipefail
          unset RECIPAVO_PREVIEW_ORIGIN
          npm run verify:production -- "$RELEASE_SHA" https://www.recipavo.com "$PWD/dist"
          node --input-type=module -e '
            const response = await fetch("https://www.recipavo.com/api/feedback", {redirect:"manual", signal:AbortSignal.timeout(20000)});
            if (response.status !== 405 || !/application\/json/i.test(response.headers.get("content-type") ?? "")) throw new Error("HOLD: Cloudflare Pages Function GET not installed");
            if (!/no-store/i.test(response.headers.get("cache-control") ?? "")) throw new Error("HOLD: Feedback cache policy missing");
            const body = await response.json();
            if (body.error !== "method_not_allowed") throw new Error("HOLD: Unexpected feedback GET response");
            console.log("PASS: feedback GET 405 (no POST sent)");
          '
      - name: Record verified production release
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          {
            echo '## Recipavo production release verified'
            echo "- GitHub SHA: $RELEASE_SHA"
            echo '- Cloudflare project / branch: recipavo-site / production'
            echo '- CI: exact SHA / Recipe site success'
            echo '- GitHub Environment: 10-minute wait timer, main-only, admin bypass disabled'
            echo '- Production HTML, SEO, sitemap, assets: PASS'
            echo '- Pages Function GET /api/feedback: 405'
            echo '- Feedback POST: NOT TESTED / NOT ENABLED'
            echo '- URL: https://www.recipavo.com/'
          } >> "$GITHUB_STEP_SUMMARY"
