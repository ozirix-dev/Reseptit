name: Recipe site

on:
  push:
    branches: [main]
    paths:
      - "reseptit/**"
      - "kaannokset/**"
      - "kuvat/**"
      - "site/**"
      - "docs/nutrition/**"
      - "docs/research/**"
      - "meta/kaannokset/**"
      - ".github/dependabot.yml"
      - ".github/workflows/pages.yml"
  pull_request:
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run all unit, translation, image, static, and browser checks
        type: boolean
        required: false
        default: true
      deploy:
        description: Publish the built Pages artifact
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: recipe-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    outputs:
      publish: ${{ steps.select.outputs.publish }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Verify changed-path selector
        run: node site/scripts/select-ci-checks.test.mjs

      - name: Verify browser-suite allowlist
        run: node --test site/scripts/run-browser-suites.test.mjs

      - name: Verify the tested revision
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            test "$(git rev-parse HEAD^1)" = "$PR_BASE"
            test "$(git rev-parse HEAD^2)" = "$PR_HEAD"
          fi
          printf 'Tested commit: %s\nPR head: %s\nPR base: %s\n' "$TESTED_SHA" "$PR_HEAD" "$PR_BASE" >> "$GITHUB_STEP_SUMMARY"

      - name: Select risk-based checks
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_FULL: ${{ inputs.full_suite || false }}
          DEPLOY: ${{ inputs.deploy || false }}
        run: node site/scripts/select-ci-checks.mjs

      - name: Require changed-path evidence
        if: steps.select.outputs.classification_error == 'true'
        run: exit 1

      - name: Check Git whitespace
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $head = $env:HEAD_SHA
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            git show --check --format=oneline $head
          }
          elseif ([string]::IsNullOrWhiteSpace($env:BASE_SHA) -or $env:BASE_SHA -match '^0+$') {
            git show --check --format=oneline $head
          }
          else {
            git diff --check $env:BASE_SHA $head
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pre-publication editorial evidence for new FI recipes
        if: steps.select.outputs.full == 'true' || contains(steps.select.outputs.changed_paths, 'reseptit/') || contains(steps.select.outputs.changed_paths, 'new-recipe-preflight')
        env:
          BASE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # For a PR, checkout points to GitHub's test merge. Compare with its
          # first parent so changes already on main do not become candidates.
          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "workflow_dispatch" || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            export BASE_SHA="$(git rev-parse HEAD^1)"
          fi
          node --test site/scripts/new-recipe-preflight.test.mjs
          node site/scripts/new-recipe-preflight.mjs

      - name: Install site dependencies
        if: steps.select.outputs.needs_node == 'true'
        run: npm ci
        working-directory: site

      - name: Verify that a new test's type error fails the compiler
        if: steps.select.outputs.full == 'true'
        env:
          VERIFY_TYPECHECK: 'true'
        run: node --test --test-name-pattern="an added TypeScript test" site/scripts/select-ci-checks.test.mjs

      - name: Chef correctness-first pilot (five pinned source cases)
        id: chef_pilot
        if: >-
          steps.select.outputs.needs_node == 'true' &&
          (contains(steps.select.outputs.changed_paths, 'chef-quality-gate') ||
           contains(steps.select.outputs.changed_paths, 'chef-quality-pilot') ||
           (github.event_name == 'pull_request' && contains(steps.select.outputs.changed_paths, '.github/workflows/pages.yml')))
        working-directory: site
        run: |
          node --test scripts/chef-quality-gate.test.mjs
          node scripts/chef-quality-gate.mjs --out=site/chef-quality-pilot
          cat chef-quality-pilot.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save chef quality pilot evidence
        if: steps.chef_pilot.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: chef-quality-pilot-five
          path: |
            site/chef-quality-pilot.md
            site/chef-quality-pilot.json
          if-no-files-found: error
          retention-days: 14

      - name: Generate nutrition and GK outputs required by isolated TypeScript checks
        if: steps.select.outputs.run_content_sync == 'true' && steps.select.outputs.run_build != 'true'
        run: |
          npm run content:sync
          npm run audit:nutrition -- --strict
          npm run audit:glycemic-load
        working-directory: site

      - name: Typecheck site source, scripts and tests
        if: steps.select.outputs.run_typecheck == 'true'
        run: npm run typecheck
        working-directory: site

      - name: Fail-closed source SHA / generic instructions preflight for D30
        if: contains(steps.select.outputs.changed_paths, 'd30-source-worklist.json') || contains(steps.select.outputs.changed_paths, 'translation-source-preflight.mjs')
        run: |
          node scripts/translation-source-preflight.mjs --ledger=meta/kaannokset/d30-source-worklist.json
          node --test scripts/translation-source-preflight.test.mjs
        working-directory: site

      - name: E20 fail-closed source preflight (20 FI / 60 planned pairs)
        if: contains(steps.select.outputs.changed_paths, 'e20-source-worklist.json')
        working-directory: site
        run: node scripts/translation-source-preflight.mjs --ledger=meta/kaannokset/e20-source-worklist.json

      - name: Validate changed recipe, translation, and evidence records
        if: steps.select.outputs.run_content == 'true'
        shell: pwsh
        env:
          CHANGED_PATHS: ${{ steps.select.outputs.changed_paths }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          $paths = @($env:CHANGED_PATHS -split "`n" | Where-Object { $_ })
          $npmArguments = @('run', 'validate:changed-content', '--') + $paths
          & npm @npmArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        working-directory: site

      - name: Check translation approvals and generate the work queue
        if: steps.select.outputs.run_content == 'true' || steps.select.outputs.run_translation_review == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: npm run queue:translations -- --base="$BASE_SHA"
        working-directory: site

      - name: Upload the translation work queue
        if: ${{ !cancelled() && (steps.select.outputs.run_content == 'true' || steps.select.outputs.run_translation_review == 'true') }}
        uses: actions/upload-artifact@v7
        with:
          name: translation-queue
          path: tmp/translation-review/queue.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Check new recipes for semantic duplicates (advisory)
        if: steps.select.outputs.run_content == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          npm run audit:similarity -- --changed --limit=20 --output=site/similarity-review.md
          cat similarity-review.md >> "$GITHUB_STEP_SUMMARY"
        working-directory: site

      - name: Full duplicate inventory when detector changes
        if: contains(steps.select.outputs.changed_paths, 'recipe-similarity')
        run: |
          npm run audit:similarity -- --all --limit=30 --output=site/similarity-inventory.md
          cat similarity-inventory.md >> "$GITHUB_STEP_SUMMARY"
        working-directory: site

      - name: Upload full duplicate audit for editorial review
        if: contains(steps.select.outputs.changed_paths, 'recipe-similarity')
        uses: actions/upload-artifact@v7
        with:
          name: recipe-similarity-inventory
          path: |
            site/similarity-inventory.md
            site/similarity-inventory.json
          if-no-files-found: error
          retention-days: 14

      - name: Build the publishable site
        if: steps.select.outputs.run_build == 'true'
        run: npm run build
        working-directory: site

      - name: Run selected unit tests
        if: steps.select.outputs.needs_node == 'true'
        shell: pwsh
        env:
          UNIT_TESTS: ${{ steps.select.outputs.unit_tests }}
        run: |
          if ($env:UNIT_TESTS -eq '*') {
            & npm test
          }
          else {
            $tests = @($env:UNIT_TESTS -split '\s+' | Where-Object { $_ })
            if ($tests.Count -gt 0) {
              $npmArguments = @('exec', '--', 'tsx', '--test') + $tests
              & npm @npmArguments
            }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        working-directory: site

      - name: Run nutrition model checks
        if: steps.select.outputs.run_nutrition == 'true'
        run: npm run test:nutrition
        working-directory: site

      - name: Run GI/GK calculation regressions
        if: steps.select.outputs.run_glycemic == 'true'
        run: npm run test:glycemic
        working-directory: site

      - name: Run translation review checks
        if: steps.select.outputs.run_translation_review == 'true'
        run: npm run test:translations
        working-directory: site

      - name: Run image pipeline checks
        if: steps.select.outputs.run_images == 'true'
        run: npm run test:image
        working-directory: site

      - name: Run GI/GK coverage audit
        if: steps.select.outputs.run_glycemic == 'true' || steps.select.outputs.full == 'true'
        run: npm run audit:glycemic-coverage
        working-directory: site

      - name: Check generated static output
        if: steps.select.outputs.run_static == 'true'
        run: npm run test:static
        working-directory: site

      - name: Run focused Playwright browser suites
        if: steps.select.outputs.run_browser == 'true'
        run: node scripts/run-browser-suites.mjs
        working-directory: site
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
          BROWSER_SUITES: ${{ steps.select.outputs.browser_suites }}

      - uses: actions/configure-pages@v6
        if: steps.select.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.select.outputs.publish == 'true'
        with:
          path: site/dist

  deploy:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
