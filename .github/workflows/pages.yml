name: Recipe site

on:
  push:
    branches: [main]
    paths:
      - "reseptit/**"
      - "kaannokset/**"
      - "kuvat/**"
      - "assets/images.manifest.json"
      - "site/**"
      - "docs/nutrition/**"
      - "docs/research/**"
      - "meta/kaannokset/**"
      - "meta/recipe-successors.json"
      - ".github/dependabot.yml"
      - ".github/workflows/pages.yml"
  pull_request:
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run all unit, translation, image, static, and browser checks
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: recipe-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Verify or restore manifest image inputs
        id: images
        shell: pwsh
        env:
          USE_PUBLIC_IMAGES: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}
          IMAGE_CI_ACCESS_KEY_ID: ${{ secrets.IMAGE_CI_ACCESS_KEY_ID }}
          IMAGE_CI_SECRET_ACCESS_KEY: ${{ secrets.IMAGE_CI_SECRET_ACCESS_KEY }}
        run: |
          $manifest = 'assets/images.manifest.json'
          $data = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json -AsHashtable
          if ($env:USE_PUBLIC_IMAGES -eq 'true') {
            # Fork/Dependabot runs use only the pinned public publication.
            # Every source hash must match; private credentials are never used.
            $data['ci']['mode'] = 'public'
            $manifest = Join-Path $env:RUNNER_TEMP 'public-image-inputs.json'
            [IO.File]::WriteAllText($manifest, ($data | ConvertTo-Json -Depth 100), [Text.UTF8Encoding]::new($false))
          }
          $json = & python3 -B site/scripts/restore-image-inputs.py --manifest $manifest --project ozirix-dev/Reseptit --auto-root kuvat
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $result = ($json -join "`n") | ConvertFrom-Json
          if ($result.status -ne 'PASS' -or [string]::IsNullOrWhiteSpace($result.imageRoot) -or $result.imageRoot -match "[`r`n]") {
            throw 'Image inputs did not return a safe verified root'
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "root=$($result.imageRoot)"
          Write-Host "Verified $($result.files) image inputs (mode=$($data['ci']['mode']))"

      - name: Test verified Git-tracked recipe image overlays
        run: python3 -B -m unittest discover -v -s site/scripts -p 'test_verified_image_overlay.py'

      - name: Append SHA-256-verified Git-tracked recipe image overlays
        shell: bash
        env:
          VERIFIED_IMAGE_ROOT: ${{ steps.images.outputs.root }}
        run: python3 -B site/scripts/verified_image_overlay.py --manifest assets/images.tracked-overlays.json --source-root kuvat --image-root "$VERIFIED_IMAGE_ROOT" --mode apply

      - name: Verify production image bootstrap
        run: node --test site/scripts/build-production.test.mjs

      - name: Verify changed-path selector
        run: node site/scripts/select-ci-checks.test.mjs

      - name: Verify browser-suite allowlist
        run: node --test site/scripts/run-browser-suites.test.mjs

      - name: Verify the tested revision
        id: revision
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SNAPSHOT: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          pr_base=""
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            test "$(git rev-parse HEAD^2)" = "$PR_HEAD"
            base_ref="refs/heads/$PR_BASE_REF"
            git check-ref-format "$base_ref"
            pr_base="$(git rev-parse HEAD^1)"
            # The payload can retain the base SHA from when the PR was opened.
            # Verify the merge parent against the current ref on this repository.
            current_base="$(git ls-remote --exit-code origin "$base_ref" | cut -f1)"
            test "$pr_base" = "$current_base"
            git merge-base --is-ancestor "$PR_BASE_SNAPSHOT" "$pr_base"
          fi
          printf 'pr_base=%s\n' "$pr_base" >> "$GITHUB_OUTPUT"
          printf 'Tested commit: %s\nPR head: %s\nPR base: %s\n' "$TESTED_SHA" "$PR_HEAD" "$pr_base" >> "$GITHUB_STEP_SUMMARY"

      - name: Check gh-aw review preparation
        run: python3 -B -m unittest discover -v -s .github/scripts -p 'test_prepare_recipavo_review.py'

      - name: Select risk-based checks
        id: select
        env:
          BASE_SHA: ${{ steps.revision.outputs.pr_base || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_FULL: ${{ inputs.full_suite || false }}
        run: node site/scripts/select-ci-checks.mjs

      # Always refresh raw and projected FI findings from the same tested revision.
      # The selector skips docs, feedback UI and translation-only changes.
      - name: Verify FI editorial inventory on recipe presentation changes
        if: steps.select.outputs.run_editorial_audit == 'true'
        run: |
          node --test site/scripts/editorial-inventory.test.mjs
          node site/scripts/editorial-inventory.mjs
          cat tmp/editorial-inventory/current.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save advisory FI editorial inventory
        if: steps.select.outputs.run_editorial_audit == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fi-editorial-inventory
          path: |
            tmp/editorial-inventory/current.json
            tmp/editorial-inventory/current.md
          if-no-files-found: error
          retention-days: 14

      - name: Check local GI and GK SQLite tools
        if: steps.select.outputs.full == 'true' || contains(steps.select.outputs.changed_paths, 'gi_sqlite') || contains(steps.select.outputs.changed_paths, 'gi_gk_maintainer.py') || contains(steps.select.outputs.changed_paths, 'verify-pr-review.py')
        run: python3 -B -m unittest discover -s site/tests -p 'test_gi_sqlite*.py'

      - name: Require changed-path evidence
        if: steps.select.outputs.classification_error == 'true'
        run: exit 1

      - name: Check Git whitespace
        shell: pwsh
        env:
          BASE_SHA: ${{ steps.revision.outputs.pr_base || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $head = $env:HEAD_SHA
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            git show --check --format=oneline $head
          }
          elseif ([string]::IsNullOrWhiteSpace($env:BASE_SHA) -or $env:BASE_SHA -match '^0+$') {
            git show --check --format=oneline $head
          }
          else {
            git diff --check $env:BASE_SHA $head
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pre-publication editorial evidence for new FI recipes
        if: steps.select.outputs.full == 'true' || contains(steps.select.outputs.changed_paths, 'reseptit/') || contains(steps.select.outputs.changed_paths, 'new-recipe-preflight') || contains(steps.select.outputs.changed_paths, 'recipe-successors.json')
        env:
          BASE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # For a PR, checkout points to GitHub's test merge. Compare with its
          # first parent so changes already on main do not become candidates.
          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "workflow_dispatch" || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            export BASE_SHA="$(git rev-parse HEAD^1)"
          fi
          node --test site/scripts/new-recipe-preflight.test.mjs
          node site/scripts/new-recipe-preflight.mjs

      - name: Install site dependencies
        if: steps.select.outputs.needs_node == 'true'
        run: npm ci
        working-directory: site

      - name: Verify that a new test's type error fails the compiler
        if: steps.select.outputs.full == 'true'
        env:
          VERIFY_TYPECHECK: 'true'
        run: node --test --test-name-pattern="an added TypeScript test" site/scripts/select-ci-checks.test.mjs

      - name: Chef correctness-first pilot (five pinned source cases)
        id: chef_pilot
        if: >-
          steps.select.outputs.needs_node == 'true' &&
          (contains(steps.select.outputs.changed_paths, 'chef-quality-gate') ||
           contains(steps.select.outputs.changed_paths, 'chef-quality-pilot') ||
           (github.event_name == 'pull_request' && contains(steps.select.outputs.changed_paths, '.github/workflows/pages.yml')))
        working-directory: site
        run: |
          node --test scripts/chef-quality-gate.test.mjs
          node scripts/chef-quality-gate.mjs --out=site/chef-quality-pilot
          cat chef-quality-pilot.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save chef quality pilot evidence
        if: steps.chef_pilot.outcome == 'success'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: chef-quality-pilot-five
          path: |
            site/chef-quality-pilot.md
            site/chef-quality-pilot.json
          if-no-files-found: error
          retention-days: 14

      - name: Generate nutrition and GK outputs required by isolated TypeScript checks
        env:
          PROJECT_IMAGE_ROOT: ${{ steps.images.outputs.root }}
        if: steps.select.outputs.run_content_sync == 'true' && steps.select.outputs.run_build != 'true'
        run: |
          npm run content:sync
          npm run audit:nutrition -- --strict
          npm run audit:glycemic-load
        working-directory: site

      - name: Typecheck site source, scripts and tests
        if: steps.select.outputs.run_typecheck == 'true'
        run: npm run typecheck
        working-directory: site

      - name: Fail-closed source SHA / generic instructions preflight for D30
        if: contains(steps.select.outputs.changed_paths, 'd30-source-worklist.json') || contains(steps.select.outputs.changed_paths, 'translation-source-preflight.mjs')
        run: |
          node scripts/translation-source-preflight.mjs --ledger=meta/kaannokset/d30-source-worklist.json
          node --test scripts/translation-source-preflight.test.mjs
        working-directory: site

      - name: E20 fail-closed source preflight (20 FI / 60 planned pairs)
        if: contains(steps.select.outputs.changed_paths, 'e20-source-worklist.json')
        working-directory: site
        run: node scripts/translation-source-preflight.mjs --ledger=meta/kaannokset/e20-source-worklist.json

      - name: Validate changed recipe, translation, and evidence records
        if: steps.select.outputs.run_content == 'true'
        shell: pwsh
        env:
          CHANGED_PATHS: ${{ steps.select.outputs.changed_paths }}
          PROJECT_IMAGE_ROOT: ${{ steps.images.outputs.root }}
          BASE_SHA: ${{ steps.revision.outputs.pr_base || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          $paths = @($env:CHANGED_PATHS -split "`n" | Where-Object { $_ })
          $npmArguments = @('run', 'validate:changed-content', '--') + $paths
          & npm @npmArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        working-directory: site

      - name: Check translation approvals and generate the work queue
        if: steps.select.outputs.run_content == 'true' || steps.select.outputs.run_translation_review == 'true'
        env:
          BASE_SHA: ${{ steps.revision.outputs.pr_base || github.event.before || github.sha }}
        run: npm run queue:translations -- --base="$BASE_SHA"
        working-directory: site

      - name: Upload the translation work queue
        if: ${{ !cancelled() && (steps.select.outputs.run_content == 'true' || steps.select.outputs.run_translation_review == 'true') }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: translation-queue
          path: tmp/translation-review/queue.json
          if-no-files-found: ignore
          retention-days: 14

      # #369: reporting only; no source quality approval is manufactured by CI.
      - name: Generate FI translation source-quality queues (advisory)
        id: fi_translation_queues
        if: >-
          steps.select.outputs.needs_node == 'true' &&
          (steps.select.outputs.run_content == 'true' ||
           steps.select.outputs.run_translation_review == 'true' ||
           contains(steps.select.outputs.changed_paths, 'translation-batch-ci-report') ||
           contains(steps.select.outputs.changed_paths, 'translation-batch-partition') ||
           contains(steps.select.outputs.changed_paths, 'translation-fi-source-quality'))
        env:
          CHANGED_PATHS: ${{ steps.select.outputs.changed_paths }}
        working-directory: site
        run: |
          npx tsx --test tests/translation-batch-ci-report.test.ts
          npx tsx scripts/translation-batch-ci-report.ts --out=tmp/translation-source-queues/current
          cat ../tmp/translation-source-queues/current.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload FI translation source-quality queues (advisory)
        if: steps.fi_translation_queues.outcome == 'success'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fi-translation-source-queues
          path: |
            tmp/translation-source-queues/current.json
            tmp/translation-source-queues/current.md
          if-no-files-found: error
          retention-days: 14

      # #369: verify real written FI approval snapshots; never auto-authorize release.
      - name: Verify five documented FI source approvals (read-only pilot)
        id: fi_approved_pilot
        if: >-
          steps.select.outputs.needs_node == 'true' &&
          (contains(steps.select.outputs.changed_paths, 'fi-approved-source-pilot') ||
           (github.event_name == 'pull_request' &&
            contains(steps.select.outputs.changed_paths, '.github/workflows/pages.yml')))
        working-directory: site
        run: |
          npx tsx --test tests/fi-approved-source-pilot.test.ts
          npx tsx scripts/fi-approved-source-pilot.ts
          cat ../tmp/fi-source-approved-pilot/current.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload five FI approval source pilot (advisory)
        if: steps.fi_approved_pilot.outcome == 'success'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fi-approved-source-pilot-five
          path: |
            tmp/fi-source-approved-pilot/current.json
            tmp/fi-source-approved-pilot/current.md
          if-no-files-found: error
          retention-days: 14

      - name: Check new recipes for semantic duplicates (advisory)
        if: steps.select.outputs.run_content == 'true'
        env:
          BASE_SHA: ${{ steps.revision.outputs.pr_base || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          npm run audit:similarity -- --changed --limit=20 --output=site/similarity-review.md
          cat similarity-review.md >> "$GITHUB_STEP_SUMMARY"
        working-directory: site

      - name: Full duplicate inventory when detector changes
        if: contains(steps.select.outputs.changed_paths, 'recipe-similarity')
        run: |
          npm run audit:similarity -- --all --limit=30 --output=site/similarity-inventory.md
          cat similarity-inventory.md >> "$GITHUB_STEP_SUMMARY"
        working-directory: site

      - name: Upload full duplicate audit for editorial review
        if: contains(steps.select.outputs.changed_paths, 'recipe-similarity')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: recipe-similarity-inventory
          path: |
            site/similarity-inventory.md
            site/similarity-inventory.json
          if-no-files-found: error
          retention-days: 14

      - name: Build the publishable site
        env:
          PROJECT_IMAGE_ROOT: ${{ steps.images.outputs.root }}
        if: steps.select.outputs.run_build == 'true'
        run: npm run build
        working-directory: site

      - name: Compare FI editorial source and public display
        if: steps.select.outputs.run_editorial_audit == 'true'
        working-directory: site
        run: |
          npm exec -- tsx scripts/editorial-public-audit.ts
          cat ../tmp/editorial-inventory/public-current.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload public FI editorial audit
        if: steps.select.outputs.run_editorial_audit == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fi-editorial-public-parity
          path: |
            tmp/editorial-inventory/public-current.json
            tmp/editorial-inventory/public-current.md
          if-no-files-found: error
          retention-days: 14

      - name: Run selected unit tests
        if: steps.select.outputs.needs_node == 'true'
        shell: pwsh
        env:
          UNIT_TESTS: ${{ steps.select.outputs.unit_tests }}
        run: |
          if ($env:UNIT_TESTS -eq '*') {
            & npm test
          }
          else {
            $tests = @($env:UNIT_TESTS -split '\s+' | Where-Object { $_ })
            if ($tests.Count -gt 0) {
              $npmArguments = @('exec', '--', 'tsx', '--test') + $tests
              & npm @npmArguments
            }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        working-directory: site

      - name: Run nutrition model checks
        if: steps.select.outputs.run_nutrition == 'true'
        run: npm run test:nutrition
        working-directory: site

      - name: Run GI/GK calculation regressions
        if: steps.select.outputs.run_glycemic == 'true'
        run: npm run test:glycemic
        working-directory: site

      - name: Run translation review checks
        if: steps.select.outputs.run_translation_review == 'true'
        run: npm run test:translations
        working-directory: site

      - name: Run image pipeline checks
        if: steps.select.outputs.run_images == 'true'
        run: npm run test:image
        working-directory: site

      - name: Run GI/GK coverage audit
        if: steps.select.outputs.run_glycemic == 'true' || steps.select.outputs.full == 'true'
        run: npm run audit:glycemic-coverage
        working-directory: site

      - name: Check generated static output
        if: steps.select.outputs.run_static == 'true'
        run: npm run test:static
        working-directory: site

      - name: Run focused Playwright browser suites
        if: steps.select.outputs.run_browser == 'true'
        run: node scripts/run-browser-suites.mjs
        working-directory: site
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
          BROWSER_SUITES: ${{ steps.select.outputs.browser_suites }}

      - name: Preserve browser diagnostics on failure, if present
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: recipe-site-browser-diagnostics
          path: tmp/v15/
          if-no-files-found: ignore
          retention-days: 7
