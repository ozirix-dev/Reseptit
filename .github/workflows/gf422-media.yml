name: PR422 one-time gluten-free illustration generation
on:
  push:
    branches:
      - editorial/gf-five-drafts-20261110
    paths:
      - .github/workflows/gf422-media.yml
permissions:
  contents: write
jobs:
  draw:
    if: github.repository == 'ozirix-dev/Reseptit'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install pinned dependencies
        working-directory: site
        run: npm ci
      - name: Render five original SVG-based WebP illustrations
        working-directory: site
        run: node scripts/generate-gf422-media.mjs
      - name: Commit exactly five verified images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            kuvat/leivonnaiset/gluteeniton-siemenvuokaleipa.webp \
            kuvat/leivonnaiset/gluteenittomat-kauralesesampylat.webp \
            kuvat/leivonnaiset/gluteeniton-durrapizzapohja.webp \
            kuvat/jalkiruoat/gluteeniton-perunajauhokakkupohja.webp \
            kuvat/jalkiruoat/gluteeniton-uunipannukakku.webp
          if git diff --staged --quiet; then
            echo "Images already exist. No commit needed."
            exit 0
          fi
          git commit -m "assets: add five original gluten-free WebP illustrations"
          git push origin "HEAD:$GITHUB_REF_NAME"
