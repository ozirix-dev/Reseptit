name: Pages deployment diagnosis and guarded one-shot cleanup

on:
  pull_request:
    paths:
      - ".github/workflows/pages-diagnostic.yml"
  workflow_dispatch:

# One supported cancel of an already failed, empty-status Pages deployment.
# No deploy-pages invocation, artifact upload, source change or retry.
permissions:
  contents: read
  pages: write
  deployments: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect Pages site and deployment status without publishing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: a90df8fa7698a74c29b8afe67dc842af300d9ef2
        run: |
          set -euo pipefail
          request() {
            local label="$1" endpoint="$2" http
            http="$(curl -sS -L --max-time 20 --retry 0 \
              -o response.json -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/${endpoint}")"
            echo "PROBE ${label}: HTTP ${http}"
            if [ "${http}" != 200 ]; then
              jq -c '{message,documentation_url,status}' response.json 2>/dev/null || true
              return 0
            fi
            case "${label}" in
              site)
                jq -c '{status,build_type,html_url,source,https_enforced}' response.json
                ;;
              pages_deployment)
                jq -c '{status,description,error,message}' response.json
                ;;
              environment_deployments)
                jq -c '[.[] | {id,sha,environment,created_at,updated_at,description}]' response.json
                jq -r '.[0:3][]?.id' response.json > recent_ids.txt
                ;;
              environment_status)
                jq -c '[.[0:3][] | {state,created_at,description,log_url}]' response.json
                ;;
            esac
          }
          echo "Diagnostic only: ${REPO} at ${TARGET_SHA}"
          request site "pages"
          request pages_deployment "pages/deployments/${TARGET_SHA}"
          request environment_deployments "deployments?environment=github-pages&per_page=5"
          if [ -f recent_ids.txt ]; then
            while IFS= read -r deployment_id; do
              case "${deployment_id}" in
                ''|*[!0-9]*) continue ;;
              esac
              request environment_status "deployments/${deployment_id}/statuses?per_page=3"
            done < recent_ids.txt
          fi
          echo "PROBE DONE: read-only inspection complete."

      - name: One guarded cancel request only for failed empty-status Pages deployment
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: a90df8fa7698a74c29b8afe67dc842af300d9ef2
        run: |
          set -euo pipefail
          get() {
            curl -sS -L --max-time 20 --retry 0 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/${1}"
          }
          get "pages/deployments/${TARGET_SHA}" > current.json
          get "deployments?environment=github-pages&per_page=2" > environment.json
          last_sha="$(jq -r '.[0].sha // ""' environment.json)"
          last_id="$(jq -r '.[0].id // ""' environment.json)"
          if [[ ! "${last_id}" =~ ^[0-9]+$ ]]; then
            echo "STOP: no valid GitHub deployment ID"; exit 1
          fi
          get "deployments/${last_id}/statuses?per_page=1" > statuses.json
          page_state="$(jq -r '.status // ""' current.json)"
          environment_state="$(jq -r '.[0].state // ""' statuses.json)"
          echo "GUARD Pages status: ${page_state:-<empty>}"
          echo "GUARD last environment SHA: ${last_sha}"
          echo "GUARD last environment status: ${environment_state}"
          if [[ "${last_sha}" != "${TARGET_SHA}" || "${page_state}" != "" || "${environment_state}" != "failure" ]]; then
            echo "SAFE STOP: state changed; no cancellation requested"
            exit 0
          fi
          http="$(curl -sS -L --max-time 20 --retry 0 -X POST \
            -o cancellation.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/pages/deployments/${TARGET_SHA}/cancel")"
          echo "PAGES_CANCEL_REQUEST: HTTP ${http}"
          if [[ "${http}" != "204" ]]; then
            jq -c '{message,status,documentation_url}' cancellation.json 2>/dev/null || true
            echo "Pages cancel was not accepted; do not retry automatically"
            exit 0
          fi
          get "pages/deployments/${TARGET_SHA}" > after.json
          jq -c '{status,description,message}' after.json
          echo "DONE: exactly one cancel request; NO PAGES DEPLOYMENT WAS STARTED."
